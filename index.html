<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="converter-card">

            <h1>🌡 Temperature Converter</h1>
            <p class="subtitle">Convert temperatures between Celsius, Fahrenheit and Kelvin</p>

            <div class="form-group">
                <label for="temperature">Temperature Value</label>
                <input 
                    type="text" 
                    id="temperature" 
                    placeholder="Enter temperature"
                    autocomplete="off"
                >
                <p id="errorMessage" class="error"></p>
            </div>

            <div class="form-group">
                <label for="inputUnit">Input Unit</label>
                <select id="inputUnit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <button id="convertBtn">Convert Temperature</button>

            <div class="results">
                <h2>Results</h2>

                <div class="result-item">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-item">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-item">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
